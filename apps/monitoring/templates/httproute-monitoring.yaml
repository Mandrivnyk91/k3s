apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: monitoring
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: argocd
  hostnames:
    - "monitoring.localhost"
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-grafana
          port: 80