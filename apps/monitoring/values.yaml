kube-prometheus-stack:
  enabled: true
  grafana:
    enabled: true
    sidecar:
      dashboards:
        enabled: true
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://monitoring-loki.monitoring.svc.cluster.local:3100
        access: proxy
      - name: Tempo
        type: tempo
        url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
        access: 
        proxyjsonData:
          tracesToLogsV2:
            datasourceUid: 'Loki'
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            tags: ['app', 'container', 'k8s.pod.name']
            filterByTraceID: true
            filterBySpanID: false
            customQuery: '{app="${__tags.app}"} |= "${__trace.id}"'
  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false

loki:
  enabled: true
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage_config:
      filesystem:
        directory: /var/loki/chunks
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    rulerConfig:       
      enable_api: true
      
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: standard
      size: 5Gi

  gateway:
    enabled: false

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
    
tempo:
  enabled: true
  tempo:
    metricsGenerator:
      enabled: true
    overrides:
      defaults:
        metrics_generator:
          processors:
            - local-blocks

alloy:
  enabled: true
  alloy:
    mounts:
      varlog: true
    configMap:
      content: |
        logging {
          level  = "info"
          format = "logfmt"
        }

        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.endpoint.receiver]
        }

        loki.write "endpoint" {
          endpoint {
            url = "http://monitoring-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          output {
            traces = [otelcol.exporter.otlp.tempo.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "monitoring-tempo.monitoring.svc.cluster.local:4317"

            tls {
              insecure = true
            }
          }
        }
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317