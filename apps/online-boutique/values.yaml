fullnameOverride: boutique

globalEnv:
  ENV: "dev"
  LOG_LEVEL: "info"
  ENABLE_STATS: 1
  ENABLE_TRACING: 1
  COLLECTOR_SERVICE_ADDR: "monitoring-alloy.monitoring.svc:4317"

resources:
  requests:
    cpu: 200m
    memory: 220Mi
  limits:
    cpu: 300m
    memory: 450Mi

services:
  frontend:
    isCritical: true
    component: ui
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    tag: v0.10.6
    conection: http
    port: 80
    targetPort: 8080
    configMapName: global-config
    env:
      PORT: "8080"
    probes:
      readinessProbe:
        initialDelaySeconds: 10
        httpGet:
          path: "/_healthz"
          port: 8080
          httpHeaders:
          - name: "Cookie"
            value: "shop_session-id=x-readiness-probe"
      livenessProbe:
        initialDelaySeconds: 10
        httpGet:
          path: "/_healthz"
          port: 8080
          httpHeaders:
          - name: "Cookie"
            value: "shop_session-id=x-liveness-probe"
  
  adservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/adservice
    tag: v0.10.6
    conection: grpc
    port: 9555
    targetPort: 9555
    env:
      PORT: "9555"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 9555
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 9555

  cartservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/cartservice
    tag: v0.10.6
    conection: grpc
    port: 7070
    targetPort: 7070
    env:
      REDIS_ADDR: "redis:6379"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 7070
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 7070

  checkoutservice:
    isCritical: true
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
    tag: v0.10.6
    conection: grpc
    port: 5050
    targetPort: 5050
    env:
      PORT: "5050"
    configMapName: global-config
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 5050
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 5050

  currencyservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/currencyservice
    tag: v0.10.6
    conection: grpc
    port: 7000
    targetPort: 7000
    env:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 7000
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 7000

  emailservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/emailservice
    tag: v0.10.6
    conection: grpc
    port: 8080
    targetPort: 8080
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 8080
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 8080

  paymentservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    tag: v0.10.6
    conection: grpc
    port: 50051
    targetPort: 50051
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 50051
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 50051

  productcatalogservice:
    isCritical: false
    component: backend
    image: gcr.io/google-samples/microservices-demo/productcatalogservice
    tag: v0.10.0
    conection: grpc
    port: 3550
    targetPort: 3550
    env:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 3550
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 3550

  recommendationservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/recommendationservice
    tag: v0.10.6
    conection: grpc
    port: 8080
    targetPort: 8080
    env:
      PORT: "8080"
      DISABLE_PROFILER: "1"
      PRODUCT_CATALOG_SERVICE_ADDR: "productcatalogservice:3550"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 8080
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 8080

  shippingservice:
    isCritical: false
    component: backend
    image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/shippingservice
    tag: v0.10.6
    conection: grpc
    port: 50051
    targetPort: 50051
    env:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    probes:
      readinessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 50051
      livenessProbe:
        initialDelaySeconds: 20
        periodSeconds: 15
        grpc:
          port: 50051


namespaceResources:
  quota:
    enabled: true
    hard:
      requests.cpu: "4"
      requests.memory: 8Gi
      limits.cpu: "8"
      limits.memory: 16Gi
      pods: "20"
  limitRange:
    enabled: true
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"