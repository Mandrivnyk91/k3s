apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: shared-gateway
      namespace: argocd
  hostnames:
    - "shop.localhost"
  rules:
    - backendRefs:
        - name: frontend
          port: 80