{{- range $serviceName, $service := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  labels:
    app: {{ $serviceName }}
spec:
  type: ClusterIP
  selector:
    app: {{ $serviceName }}
  ports:
  - name: {{ $service.conection }}
    port: {{ $service.port }}
    targetPort: {{ $service.targetPort }}
---
{{- end }}