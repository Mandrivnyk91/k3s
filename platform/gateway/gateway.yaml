apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: argocd
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 10.10.10.200
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All